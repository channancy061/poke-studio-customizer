name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v"); if ($v -notmatch '^\d+\.\d+\.\d+') { $v = "0.1.0" }
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Publish + installer
        shell: pwsh
        run: ./build/publish.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/installer/*.exe

  linux:
    runs-on: ubuntu-22.04   # older glibc = AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Version
        run: |
          v="${GITHUB_REF_NAME#v}"; [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || v="0.1.0"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Publish + AppImage
        run: bash build/linux/build-appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/appimage/*.AppImage

  # a tag (v0.1.0…) also publishes a GitHub Release page, so testers can download without a GitHub account
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "Poke Studio Customizer $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease
